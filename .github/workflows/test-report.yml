name: Test Report
on:
  workflow_run:
    workflows: [Validate Pull Request]
    types: [completed]

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  report:
    if: ${{ github.event.workflow_run.conclusion != 'cancelled' }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish test report
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          artifact: go-test-results
          name: Go Test Results
          path: junit.xml
          reporter: java-junit
          use-actions-summary: 'false'
          list-suites: all
          list-tests: failed
          fail-on-error: 'true'
          fail-on-empty: 'true'
          collapsed: 'never'
