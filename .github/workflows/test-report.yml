name: Test Report
on:
  workflow_run:
    workflows: [Validate Pull Request]
    types: [completed]

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  report:
    if: ${{ github.event.workflow_run.conclusion != 'cancelled' }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish test report
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        with:
          artifact: go-test-results
          name: 'test results'
          path: junit.xml
          reporter: java-junit
          use-actions-summary: 'false'
          list-suites: all
          list-tests: failed
          fail-on-error: 'true'
          fail-on-empty: 'true'
          collapsed: 'never'
