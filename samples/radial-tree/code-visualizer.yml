imageSize:
    width: 1920
    height: 1920
legend:
    position: bottom-center
    orientation: horizontal
tree-map: {}
radial-tree:
    fileDiscSize: file-lines
    fileFill:
        metric: file-type
        palette: categorization
    fileBorder:
        metric: file-freshness
        palette: good-bad
    directoryDiscSize: file-lines.sum
    directoryFill:
        metric: file-type.mode
        palette: categorization
    directoryBorder:
        metric: file-freshness.mean
        palette: good-bad
    labels: folders
bubble-tree:
    labels: folders
spiral:
    resolution: daily
    labels: laps
fileFilter:
    - pattern: .*
      mode: exclude
