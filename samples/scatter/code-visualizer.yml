imageSize:
    width: 1920
    height: 1080
scatter:
    xAxis: file-size.sum
    xScale: log
    yAxis: comment-ratio.mean
    size: declarations.count
    grain: directory
    fill:
        metric: declarations.count
        palette: foliage
    border:
        metric: public.declarations.count
        palette: foliage
fileFilter:
    - pattern: .*
      mode: exclude
    - pattern: testdata
      mode: exclude
