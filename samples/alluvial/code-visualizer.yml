imageSize:
    width: 1920
    height: 1080
alluvial:
    references:
        - tag:v0.5.0
        - tag:v0.6.0
        - tag:v0.7.0
    metric: file-lines
    fill:
      metric: lines-changed.sum.delta
      palette: good-bad
    expand:
        - cmd
        - internal
fileFilter:
    - pattern: .*
      mode: exclude
    - pattern: docs
      mode: exclude
